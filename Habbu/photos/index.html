<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kedar | Birthday Film ❤️</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Floating Particles -->
    <div id="particles"></div>

    <!-- Background Glow -->
    <div class="background-glow"></div>

    <!-- INTRO -->
    <section class="intro">

        <div class="intro-content">

            <p class="loading">
                LOADING MEMORIES...
            </p>

            <h1 class="title">
                KEDAR
            </h1>

            <p class="subtitle">
                A Birthday Film Made With ❤️
            </p>

            <button class="start-btn" onclick="startExperience()">
                ENTER STORY ↓
            </button>

        </div>

    </section>

    <!-- Background Music -->
    <audio id="music" loop>
        <source src="music.mp3" type="audio/mp3">
    </audio>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
